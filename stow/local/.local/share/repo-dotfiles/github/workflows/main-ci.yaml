name: main-ci.yaml

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/compose/**'
      - 'docker/images/**'
      - 'python/packages/**'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: docker pull
        run: docker pull registry.docker.internal:5000/main-ci-action:3.14

      - name: registry.docker.internal:5000/main-ci-action
        uses: docker://registry.docker.internal:5000/main-ci-action:3.14
