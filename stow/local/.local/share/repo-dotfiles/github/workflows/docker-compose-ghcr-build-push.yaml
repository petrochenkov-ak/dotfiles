name: docker-compose-ghcr-build-push.yaml

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/compose/**'
      - 'docker/images/**'
      - 'python/**'
  workflow_dispatch:
  workflow_run:
    workflows:
      - "python-requirements-action"
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write

    steps:
      - name: petrochenkov-ak-lab/docker-compose-ghcr-build-push-action@main
        uses: petrochenkov-ak-lab/docker-compose-ghcr-build-push-action@main
