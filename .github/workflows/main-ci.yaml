name: main-ci.yaml

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/docker-bake.hcl'
      - 'docker/images/**'
      - 'python/packages/**'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: [self-hosted, linux]
    steps:
      - name: actions/checkout
        uses: actions/checkout@v4

      - name: registry.docker.internal:5000/main-ci-action
        uses: docker://registry.docker.internal:5000/main-ci-action:latest
